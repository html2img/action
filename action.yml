name: 'HTML to Image'
description: 'Generate Open Graph images, screenshots and social cards in CI with the HTML to Image API (html2img.com).'
author: 'html2img'

branding:
  icon: 'image'
  color: 'blue'

inputs:
  api-key:
    # No workflow expression here: GitHub evaluates them when it loads this
    # file, where the secrets context does not exist.
    description: 'Your html2img API key, read from a repository secret. It is masked in the logs.'
    required: true
  html:
    description: 'Inline HTML document to render. Mutually exclusive with html-file, url and template.'
    required: false
  html-file:
    description: 'Path to an HTML file in the workspace to render. Mutually exclusive with html, url and template.'
    required: false
  url:
    description: 'Publicly reachable URL to screenshot. Mutually exclusive with html, html-file and template.'
    required: false
  template:
    description: 'Slug of a named template to render, for example open-graph-image. Mutually exclusive with html, html-file and url.'
    required: false
  variables:
    description: 'JSON object of the template inputs. Only valid alongside template.'
    required: false
  width:
    description: 'Viewport width in pixels, 1 to 5000. Defaults to the API default of 1440. Ignored for PDF and template renders.'
    required: false
  height:
    description: 'Viewport height in pixels, 1 to 5000. Defaults to the API default of 900. Ignored for PDF and template renders, and when full-page is true.'
    required: false
  full-page:
    description: 'Capture the whole height of the content instead of the viewport. Ignored for PDF and template renders. Forces dpi to 1.'
    required: false
  selector:
    description: 'CSS selector to crop the capture to. Only valid with url, and must match exactly one element. Ignored for PDF.'
    required: false
  wait-for-selector:
    description: 'Wait until this CSS selector appears in the DOM before capturing. Not detected inside iframes.'
    required: false
  dpi:
    description: 'Device pixel ratio, 1 to 4. Defaults to the API default, which is 1 for a url screenshot and 2 for HTML. Ignored for PDF and template renders, and forced to 1 when full-page is true.'
    required: false
  css:
    description: 'Extra CSS injected into the page, for hiding cookie banners or forcing a colour scheme. Page styles often win on specificity, so !important is usually needed.'
    required: false
  format:
    description: 'Output format, png or pdf. Defaults to the API default of png. The API does not produce JPEG.'
    required: false
  output-path:
    description: 'Path in the workspace to download the render to. Parent directories are created. Leave unset to use the url output only.'
    required: false
  skip-unchanged:
    description: 'Skip the API call when output-path already exists and its .html2img-hash sidecar matches the current inputs.'
    required: false
    default: 'true'

outputs:
  url:
    description: 'The hosted URL of the render. On a skip, the URL recorded in the sidecar.'
  path:
    description: 'The path the render was downloaded to, or empty when output-path was not set.'
  skipped:
    description: 'true when the render was skipped because the inputs had not changed, otherwise false.'

runs:
  using: 'node20'
  main: 'dist/index.js'
