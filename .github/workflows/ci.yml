name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      # The node20 runner executes dist/ directly, so a stale bundle ships
      # source that never runs. Rebuild and fail if the result differs.
      - name: Rebuild dist
        run: npm run build

      - name: Check dist is committed and up to date
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "dist/ is out of date. Run 'npm run build' and commit the result." >&2
            git --no-pager diff --stat dist
            exit 1
          fi
